<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Optimizador de Grafos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Optimización de Coloración de Grafos</h1>

    <div class="controles">
      <label>Vértices (20 - 50):</label>
      <input type="number" id="numVertices" value="30" min="20" max="50" />

      <label>Colores (k):</label>
      <input type="number" id="numColores" value="3" min="3" max="4" />

      <label>Probabilidad de Cruce (Pc):</label>
      <input
        type="number"
        id="probCruce"
        value="0.8"
        step="0.1"
        min="0.7"
        max="0.9"
      />

      <label>Mutación (Pm):</label>
      <select id="probMutacion">
        <option value="0.01">0.01</option>
        <option value="0.05">0.05</option>
        <option value="0.1">0.1</option>
      </select>

      <!-- aquí se llama a la función para resolver el grafo -->
      <button onclick="stevenGordo()">Resolver Grafo</button>
    </div>

    <hr />

      <h3>Mejor Solución:</h3>
      <p id="mejorResultado">aquí se va a mostrar el resultado si se termina el trabajo ajaja</p>
    </div>

  </body>
</html>
